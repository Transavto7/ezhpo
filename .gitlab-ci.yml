stages:
  - build
  - upload
  - deploy
  - notify

.ssh_setup:
  before_script:
    - apk add --no-cache openssh coreutils tar
    - mkdir -p ~/.ssh
    - echo "$SSH_KEY_B64" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts || true

build_frontend:
  stage: build
  image: node:18-alpine
  script:
    - npm install --legacy-peer-deps
    - npm run production
    - tar -czf public-${CI_COMMIT_SHA}.tar.gz public/css public/js public/mix-manifest.json
  artifacts:
    paths:
      - public-${CI_COMMIT_SHA}.tar.gz
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'

upload_dev:
  stage: upload
  extends: .ssh_setup
  variables:
    DEPLOY_HOST: 91.106.207.85
    DEPLOY_USER: admint4n
  script:
    - scp public-${CI_COMMIT_SHA}.tar.gz $DEPLOY_USER@$DEPLOY_HOST:/home/a/admint4n/crm.ta-7.ru/artifacts
  needs: [build_frontend]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy_dev:
  stage: deploy
  extends: .ssh_setup
  variables:
    DEPLOY_HOST: 91.106.207.85
    DEPLOY_USER: admint4n
  script:
    - ssh $DEPLOY_USER@$DEPLOY_HOST "CI_COMMIT_SHA=${CI_COMMIT_SHA} .scripts/deploy-dev.sh"
  needs: [upload_dev]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

